<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <h1 class="title">To-Do List</h1>
        <div class="input-container">
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button id="add-task-btn">Add</button>
        </div>
        <ul id="task-list"></ul>
    </div>
    <div class="floating-buttons">
        <a href="https://github.com/DianaSill/task-list-app" target="_blank" class="floating-github-button">
            <img src="assets/github-mark.svg" alt="GitHub Logo" class="github-icon" />
            <span class="github-text">Go to the repository</span>
        </a>
        <a href="https://dianasill.github.io/" class="floating-house-button">
            <img src="assets/house.svg" alt="House Icon" class="house-icon" />
        </a>
    </div>
    <script src="script.js"></script>
</body>

</html>
